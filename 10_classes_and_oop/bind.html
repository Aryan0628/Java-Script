<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>
</body>
<script>
    class React{
        constructor(){
            this.library="React"
            this.server="https://localhost:300"


            ///requirement
            document.querySelector('button').addEventListener('click',this.handleclick.bind(this))

        }
        handleclick(){
            console.log("button clicked");
            console.log(this.server);
            //agar bina bind ke kren to this ke reference to hai button ka but this.server ni ara isliye bind use krenge 
        }
    }
    const app=new React()
</script>
</html>
